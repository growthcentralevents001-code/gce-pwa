name: Supabase DB Migrations

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  migrate-dev:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development'
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply migrations to Dev
        env:
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
        run: |
          echo "Connecting to Dev database..."
          URL="$DEV_DB_URL"
          
          # Extract connection parameters from URL
          USER=$(echo "$URL" | sed -n 's/.*:\/\/\([^:]*\):.*/\1/p')
          PASS_RAW=$(echo "$URL" | sed -n 's/.*:\([^@]*\)@.*/\1/p')
          PASS=$(echo "$PASS_RAW" | sed 's/%40/@/g')
          HOST=$(echo "$URL" | sed -n 's/.*@\([^:]*\):.*/\1/p')
          PORT=$(echo "$URL" | sed -n 's/.*:\([0-9]*\)\/.*/\1/p')
          DB=$(echo "$URL" | sed -n 's/.*\/\([^?]*\).*/\1/p')
          
          echo "Database host: $HOST"
          echo "Database: $DB"
          echo "Port: $PORT"
          
          if [ ! -d "supabase/migrations" ]; then
            echo "⚠️ No migrations directory found, skipping..."
          else
            echo "Applying migrations..."
            for file in supabase/migrations/*.sql; do
              echo "Applying $file"
              PGPASSWORD="$PASS" psql -4 -h "$HOST" -U "$USER" -d "$DB" -p "$PORT" -f "$file"
            done
          fi

      - name: Verify migration
        run: echo "✅ Migration applied to Dev"

  migrate-prod:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    needs: migrate-dev
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply migrations to Prod
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          echo "Connecting to Prod database..."
          URL="$PROD_DB_URL"
          
          # Extract connection parameters from URL
          USER=$(echo "$URL" | sed -n 's/.*:\/\/\([^:]*\):.*/\1/p')
          PASS_RAW=$(echo "$URL" | sed -n 's/.*:\([^@]*\)@.*/\1/p')
          PASS=$(echo "$PASS_RAW" | sed 's/%40/@/g')
          HOST=$(echo "$URL" | sed -n 's/.*@\([^:]*\):.*/\1/p')
          PORT=$(echo "$URL" | sed -n 's/.*:\([0-9]*\)\/.*/\1/p')
          DB=$(echo "$URL" | sed -n 's/.*\/\([^?]*\).*/\1/p')
          
          echo "Database host: $HOST"
          echo "Database: $DB"
          echo "Port: $PORT"
          
          if [ ! -d "supabase/migrations" ]; then
            echo "⚠️ No migrations directory found, skipping..."
          else
            echo "Applying migrations..."
            for file in supabase/migrations/*.sql; do
              echo "Applying $file"
              PGPASSWORD="$PASS" psql -4 -h "$HOST" -U "$USER" -d "$DB" -p "$PORT" -f "$file"
            done
          fi

      - name: Verify migration
        run: echo "✅ Migration applied to Prod"
