name: Supabase DB Migrations

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  migrate-dev:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development'
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client and dig
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client dnsutils

      - name: Resolve IPv4 address of Dev DB
        id: resolve
        run: |
          IPV4=$(dig +short db.hvevqoltcwumcvxetxsf.supabase.co A | head -1)
          if [ -z "$IPV4" ]; then
            echo "❌ Failed to resolve IPv4"
            exit 1
          fi
          echo "Resolved IP: $IPV4"
          echo "IPV4=$IPV4" >> $GITHUB_ENV
          echo "IPV4=$IPV4" >> $GITHUB_OUTPUT

      - name: Apply migrations to Dev (using explicit psql with IPv4)
        env:
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
          IPV4: ${{ steps.resolve.outputs.IPV4 }}
        run: |
          echo "Using IPv4: $IPV4"
          # Parse URL
          URL="$DEV_DB_URL"
          # Extract user, password, database, port (default 5432)
          USER=$(echo "$URL" | sed -n 's/.*:\/\/\([^:]*\):.*/\1/p')
          PASS_RAW=$(echo "$URL" | sed -n 's/.*:\([^@]*\)@.*/\1/p')
          # Decode %40 to @
          PASS=$(echo "$PASS_RAW" | sed 's/%40/@/g')
          DB=$(echo "$URL" | sed -n 's/.*\/\([^?]*\).*/\1/p')
          PORT=5432
          echo "User: $USER, DB: $DB, Port: $PORT"
          for file in supabase/migrations/*.sql; do
            echo "Applying $file"
            PGPASSWORD="$PASS" psql -h "$IPV4" -U "$USER" -d "$DB" -p "$PORT" -f "$file"
          done

      - name: Verify migration
        run: echo "✅ Migration applied to Dev"

  migrate-prod:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    needs: migrate-dev
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client and dig
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client dnsutils

      - name: Resolve IPv4 address of Prod DB
        id: resolve
        run: |
          IPV4=$(dig +short db.tzeqeywezmqslovpflqu.supabase.co A | head -1)
          if [ -z "$IPV4" ]; then
            echo "❌ Failed to resolve IPv4"
            exit 1
          fi
          echo "Resolved IP: $IPV4"
          echo "IPV4=$IPV4" >> $GITHUB_ENV
          echo "IPV4=$IPV4" >> $GITHUB_OUTPUT

      - name: Apply migrations to Prod (using explicit psql with IPv4)
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          IPV4: ${{ steps.resolve.outputs.IPV4 }}
        run: |
          echo "Using IPv4: $IPV4"
          URL="$PROD_DB_URL"
          USER=$(echo "$URL" | sed -n 's/.*:\/\/\([^:]*\):.*/\1/p')
          PASS_RAW=$(echo "$URL" | sed -n 's/.*:\([^@]*\)@.*/\1/p')
          PASS=$(echo "$PASS_RAW" | sed 's/%40/@/g')
          DB=$(echo "$URL" | sed -n 's/.*\/\([^?]*\).*/\1/p')
          PORT=5432
          echo "User: $USER, DB: $DB, Port: $PORT"
          for file in supabase/migrations/*.sql; do
            echo "Applying $file"
            PGPASSWORD="$PASS" psql -h "$IPV4" -U "$USER" -d "$DB" -p "$PORT" -f "$file"
          done

      - name: Verify migration
        run: echo "✅ Migration applied to Prod"
