name: Supabase DB Migrations

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  migrate-dev:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development'
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client and DNS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client dnsutils

      - name: Resolve IPv4 address of Dev DB (with retries)
        id: resolve
        run: |
          HOST="db.hvevqoltcwumcvxetxsf.supabase.co"
          MAX_RETRIES=5
          RETRY_COUNT=0
          IPV4=""
          
          while [ -z "$IPV4" ] && [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempting DNS resolution (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)..."
            
            # Try dig first
            IPV4=$(dig -4 +short "$HOST" A 2>/dev/null | grep -v '^$' | head -1)
            
            # Try host command if dig failed
            if [ -z "$IPV4" ]; then
              IPV4=$(host -t A "$HOST" 2>/dev/null | grep "has address" | head -1 | awk '{print $4}')
            fi
            
            # Try nslookup if both failed
            if [ -z "$IPV4" ]; then
              IPV4=$(nslookup "$HOST" 8.8.8.8 2>/dev/null | grep "Address:" | tail -1 | awk '{print $2}')
            fi
            
            if [ -n "$IPV4" ]; then
              echo "✅ Resolved IP: $IPV4"
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "⏳ DNS resolution failed, retrying in 3 seconds..."
              sleep 3
            fi
          done
          
          if [ -z "$IPV4" ]; then
            echo "❌ Failed to resolve IPv4 after $MAX_RETRIES attempts"
            echo "Debugging info:"
            echo "--- dig output ---"
            dig "$HOST" || true
            echo "--- host output ---"
            host "$HOST" || true
            echo "--- nslookup output ---"
            nslookup "$HOST" 8.8.8.8 || true
            exit 1
          fi
          
          echo "IPV4=$IPV4" >> $GITHUB_ENV
          echo "IPV4=$IPV4" >> $GITHUB_OUTPUT

      - name: Apply migrations to Dev (using explicit psql with IPv4)
        env:
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
          IPV4: ${{ steps.resolve.outputs.IPV4 }}
        run: |
          echo "Using IPv4: $IPV4"
          URL="$DEV_DB_URL"
          USER=$(echo "$URL" | sed -n 's/.*:\/\/\([^:]*\):.*/\1/p')
          PASS_RAW=$(echo "$URL" | sed -n 's/.*:\([^@]*\)@.*/\1/p')
          PASS=$(echo "$PASS_RAW" | sed 's/%40/@/g')
          DB=$(echo "$URL" | sed -n 's/.*\/\([^?]*\).*/\1/p')
          PORT=5432
          echo "User: $USER, DB: $DB, Port: $PORT"
          
          if [ ! -d "supabase/migrations" ]; then
            echo "⚠️ No migrations directory found, skipping..."
          else
            for file in supabase/migrations/*.sql; do
              echo "Applying $file"
              PGPASSWORD="$PASS" psql -h "$IPV4" -U "$USER" -d "$DB" -p "$PORT" -f "$file"
            done
          fi

      - name: Verify migration
        run: echo "✅ Migration applied to Dev"

  migrate-prod:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    needs: migrate-dev
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client and DNS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client dnsutils

      - name: Resolve IPv4 address of Prod DB (with retries)
        id: resolve
        run: |
          HOST="db.tzeqeywezmqslovpflqu.supabase.co"
          MAX_RETRIES=5
          RETRY_COUNT=0
          IPV4=""
          
          while [ -z "$IPV4" ] && [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempting DNS resolution (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)..."
            
            # Try dig first
            IPV4=$(dig -4 +short "$HOST" A 2>/dev/null | grep -v '^$' | head -1)
            
            # Try host command if dig failed
            if [ -z "$IPV4" ]; then
              IPV4=$(host -t A "$HOST" 2>/dev/null | grep "has address" | head -1 | awk '{print $4}')
            fi
            
            # Try nslookup if both failed
            if [ -z "$IPV4" ]; then
              IPV4=$(nslookup "$HOST" 8.8.8.8 2>/dev/null | grep "Address:" | tail -1 | awk '{print $2}')
            fi
            
            if [ -n "$IPV4" ]; then
              echo "✅ Resolved IP: $IPV4"
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "⏳ DNS resolution failed, retrying in 3 seconds..."
              sleep 3
            fi
          done
          
          if [ -z "$IPV4" ]; then
            echo "❌ Failed to resolve IPv4 after $MAX_RETRIES attempts"
            echo "Debugging info:"
            echo "--- dig output ---"
            dig "$HOST" || true
            echo "--- host output ---"
            host "$HOST" || true
            echo "--- nslookup output ---"
            nslookup "$HOST" 8.8.8.8 || true
            exit 1
          fi
          
          echo "IPV4=$IPV4" >> $GITHUB_ENV
          echo "IPV4=$IPV4" >> $GITHUB_OUTPUT

      - name: Apply migrations to Prod (using explicit psql with IPv4)
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          IPV4: ${{ steps.resolve.outputs.IPV4 }}
        run: |
          echo "Using IPv4: $IPV4"
          URL="$PROD_DB_URL"
          USER=$(echo "$URL" | sed -n 's/.*:\/\/\([^:]*\):.*/\1/p')
          PASS_RAW=$(echo "$URL" | sed -n 's/.*:\([^@]*\)@.*/\1/p')
          PASS=$(echo "$PASS_RAW" | sed 's/%40/@/g')
          DB=$(echo "$URL" | sed -n 's/.*\/\([^?]*\).*/\1/p')
          PORT=5432
          echo "User: $USER, DB: $DB, Port: $PORT"
          
          if [ ! -d "supabase/migrations" ]; then
            echo "⚠️ No migrations directory found, skipping..."
          else
            for file in supabase/migrations/*.sql; do
              echo "Applying $file"
              PGPASSWORD="$PASS" psql -h "$IPV4" -U "$USER" -d "$DB" -p "$PORT" -f "$file"
            done
          fi

      - name: Verify migration
        run: echo "✅ Migration applied to Prod"
