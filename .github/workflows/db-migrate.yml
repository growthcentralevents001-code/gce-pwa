name: Supabase DB Migrations

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  migrate-dev:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development'
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client and dig
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client dnsutils

      - name: Resolve IPv4 address of Dev DB
        id: resolve
        run: |
          IPV4=$(dig +short db.hvevqoltcwumcvxetxsf.supabase.co A | head -1)
          echo "IPV4=$IPV4" >> $GITHUB_ENV
          echo "Resolved IP: $IPV4"

      - name: Apply migrations to Dev (using PGHOSTADDR)
        env:
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
          PGHOSTADDR: ${{ env.IPV4 }}
        run: |
          echo "Using PGHOSTADDR: $PGHOSTADDR"
          for file in supabase/migrations/*.sql; do
            echo "Applying $file"
            psql "$DEV_DB_URL" -f "$file"
          done

      - name: Verify migration
        run: echo "✅ Migration applied to Dev"

  migrate-prod:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    needs: migrate-dev
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client and dig
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client dnsutils

      - name: Resolve IPv4 address of Prod DB
        id: resolve
        run: |
          IPV4=$(dig +short db.tzeqeywezmqslovpflqu.supabase.co A | head -1)
          echo "IPV4=$IPV4" >> $GITHUB_ENV
          echo "Resolved IP: $IPV4"

      - name: Apply migrations to Prod (using PGHOSTADDR)
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          PGHOSTADDR: ${{ env.IPV4 }}
        run: |
          echo "Using PGHOSTADDR: $PGHOSTADDR"
          for file in supabase/migrations/*.sql; do
            echo "Applying $file"
            psql "$PROD_DB_URL" -f "$file"
          done

      - name: Verify migration
        run: echo "✅ Migration applied to Prod"
