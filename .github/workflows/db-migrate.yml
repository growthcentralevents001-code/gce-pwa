name: Supabase DB Migrations

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # manual trigger

jobs:
  migrate-dev:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development'
    environment: development
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Apply migration to Dev
        env:
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push --db-url "$DEV_DB_URL"
      - name: Verify migration
        run: echo "✅ Migration applied to Dev"

  migrate-prod:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    needs: migrate-dev  # optional, remove if not needed
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Apply migration to Prod
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
     run: |
          supabase db push --db-url "$PROD_DB_URL"
      - name: Verify migration
        run: echo "✅ Migration applied to Prod"
