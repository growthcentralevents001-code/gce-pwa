name: Deploy dev

on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy development branch
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            'bash -lc "systemctl reset-failed gce-dev-deploy.service 2>/dev/null || true; systemd-run --wait --collect --unit=gce-dev-deploy /root/gce-pwa-dev/scripts/deploy-dev.sh"'

      - name: Debug SSH
        if: failure()
        run: |
          echo "Testing SSH connection..."
          ssh -v -o StrictHostKeyChecking=no ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} "echo 'SSH works'"
