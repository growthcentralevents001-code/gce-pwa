name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy production
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} '
            cd /root/gce-pwa-prod || exit 1
            git stash --include-untracked || true
            git clean -fd
            git pull origin main --force
            npm install
            npm run build
            pm2 restart gce-prod
            echo "✅ Deployment successful!"
          '
