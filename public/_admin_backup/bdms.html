<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDMs Management - GCE Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        h1 { font-size: 28px; font-weight: 700; color: #0f172a; }
        .btn-add { background: #f97316; color: white; border: none; padding: 10px 24px; border-radius: 40px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn-add:hover { background: #ea580c; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: 20px; padding: 20px; border: 1px solid #eef2ff; }
        .stat-number { font-size: 32px; font-weight: 800; color: #f97316; }
        .stat-label { color: #64748b; font-size: 14px; margin-top: 4px; }
        .table-card { background: white; border-radius: 20px; padding: 20px; border: 1px solid #eef2ff; overflow-x: auto; }
        .toolbar { display: flex; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .search-input { padding: 10px 20px; border: 1px solid #e2e8f0; border-radius: 40px; width: 280px; font-size: 14px; }
        .filter-select { padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 40px; background: white; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #eef2ff; }
        th { color: #64748b; font-weight: 600; font-size: 13px; }
        .badge-active { background: #dcfce7; color: #166534; padding: 4px 12px; border-radius: 30px; font-size: 12px; display: inline-block; }
        .badge-inactive { background: #fee2e2; color: #dc2626; padding: 4px 12px; border-radius: 30px; font-size: 12px; display: inline-block; }
        .badge-phase1 { background: #fef3c7; color: #92400e; padding: 4px 12px; border-radius: 30px; font-size: 12px; display: inline-block; }
        .badge-phase2 { background: #dbeafe; color: #1e40af; padding: 4px 12px; border-radius: 30px; font-size: 12px; display: inline-block; }
        .badge-phase3 { background: #dcfce7; color: #166534; padding: 4px 12px; border-radius: 30px; font-size: 12px; display: inline-block; }
        .btn-edit { background: #3b82f6; color: white; border: none; padding: 6px 14px; border-radius: 30px; cursor: pointer; font-size: 12px; margin-right: 6px; }
        .btn-edit:hover { background: #2563eb; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 30px; cursor: pointer; font-size: 12px; }
        .btn-delete:hover { background: #dc2626; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 24px; padding: 28px; width: 500px; max-width: 90%; }
        .modal-content h3 { font-size: 22px; margin-bottom: 20px; color: #0f172a; }
        .modal-content input, .modal-content select { width: 100%; padding: 12px 16px; margin-bottom: 16px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; }
        .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
        .btn-save { background: #f97316; color: white; border: none; padding: 10px 24px; border-radius: 40px; cursor: pointer; font-weight: 600; }
        .btn-cancel { background: #e2e8f0; color: #334155; border: none; padding: 10px 24px; border-radius: 40px; cursor: pointer; font-weight: 600; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #f97316; text-decoration: none; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <a href="/admin-panel/" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
        <h1>BDMs / Franchisees Management</h1>
        <button class="btn-add" onclick="openAddModal()">+ Add New BDM</button>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-number" id="totalBDMs">0</div>
            <div class="stat-label">Total BDMs</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="activeBDMs">0</div>
            <div class="stat-label">Active BDMs</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalCommission">0</div>
            <div class="stat-label">Total Commission (₹)</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="phase2Count">0</div>
            <div class="stat-label">Phase 2+ Achieved</div>
        </div>
    </div>

    <!-- BDMs Table -->
    <div class="table-card">
        <div class="toolbar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search by name, zone, email..." onkeyup="renderTable()">
            <select id="zoneFilter" class="filter-select" onchange="renderTable()">
                <option value="All">All Zones</option>
                <option value="Mumbai West">Mumbai West</option>
                <option value="Mumbai East">Mumbai East</option>
                <option value="Mumbai South">Mumbai South</option>
                <option value="Mumbai North">Mumbai North</option>
                <option value="Delhi NCR">Delhi NCR</option>
                <option value="Bangalore">Bangalore</option>
            </select>
            <select id="statusFilter" class="filter-select" onchange="renderTable()">
                <option value="All">All Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>
        </div>
        <table id="bdmTable">
            <thead>
                <tr><th>Name</th><th>Email</th><th>Zone</th><th>Phase</th><th>Commission (₹)</th><th>Venues</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<!-- Add/Edit Modal -->
<div id="bdmModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Add New BDM</h3>
        <input type="hidden" id="bdmId">
        <input type="text" id="bdmName" placeholder="Full Name *" required>
        <input type="email" id="bdmEmail" placeholder="Email Address *" required>
        <input type="text" id="bdmPhone" placeholder="Phone Number">
        <select id="bdmZone">
            <option value="Mumbai West">Mumbai West</option>
            <option value="Mumbai East">Mumbai East</option>
            <option value="Mumbai South">Mumbai South</option>
            <option value="Mumbai North">Mumbai North</option>
            <option value="Delhi NCR">Delhi NCR</option>
            <option value="Bangalore">Bangalore</option>
        </select>
        <select id="bdmPhase">
            <option value="Phase 1">Phase 1 (0-10k)</option>
            <option value="Phase 2">Phase 2 (10k-50k)</option>
            <option value="Phase 3">Phase 3 (50k-1L)</option>
            <option value="Phase 4">Phase 4 (1L+)</option>
        </select>
        <select id="bdmStatus">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-save" onclick="saveBDM()">Save</button>
        </div>
    </div>
</div>

<script>
    let bdms = [
        { id: 1, name: "Rahul Sharma", email: "rahul.sharma@example.com", phone: "9876543210", zone: "Mumbai West", phase: "Phase 3", commission: 42500, venues: 12, status: "Active" },
        { id: 2, name: "Neha Gupta", email: "neha.gupta@example.com", phone: "9876543211", zone: "Mumbai South", phase: "Phase 2", commission: 28500, venues: 8, status: "Active" },
        { id: 3, name: "Amit Patel", email: "amit.patel@example.com", phone: "9876543212", zone: "Mumbai East", phase: "Phase 4", commission: 78500, venues: 18, status: "Active" },
        { id: 4, name: "Priya Singh", email: "priya.singh@example.com", phone: "9876543213", zone: "Delhi NCR", phase: "Phase 2", commission: 15200, venues: 5, status: "Active" },
        { id: 5, name: "Vikram Mehta", email: "vikram.mehta@example.com", phone: "9876543214", zone: "Bangalore", phase: "Phase 1", commission: 8900, venues: 3, status: "Inactive" },
        { id: 6, name: "Anjali Desai", email: "anjali.desai@example.com", phone: "9876543215", zone: "Mumbai West", phase: "Phase 3", commission: 56800, venues: 15, status: "Active" }
    ];
    let nextId = 7;
    let editId = null;

    function updateStats() {
        document.getElementById('totalBDMs').innerText = bdms.length;
        document.getElementById('activeBDMs').innerText = bdms.filter(b => b.status === 'Active').length;
        document.getElementById('totalCommission').innerText = bdms.reduce((sum, b) => sum + b.commission, 0).toLocaleString();
        document.getElementById('phase2Count').innerText = bdms.filter(b => b.phase !== 'Phase 1').length;
    }

    function getPhaseBadge(phase) {
        if (phase === 'Phase 1') return 'badge-phase1';
        if (phase === 'Phase 2') return 'badge-phase2';
        return 'badge-phase3';
    }

    function renderTable() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const zone = document.getElementById('zoneFilter').value;
        const status = document.getElementById('statusFilter').value;
        
        const filtered = bdms.filter(b => 
            (zone === 'All' || b.zone === zone) &&
            (status === 'All' || b.status === status) &&
            (b.name.toLowerCase().includes(search) || b.email.toLowerCase().includes(search) || b.zone.toLowerCase().includes(search))
        );
        
        const html = filtered.map(b => `
            <tr>
                <td><strong>${b.name}</strong><br><span style="font-size:11px;color:#666;">${b.email}</span></td>
                <td>${b.zone}</td>
                <td><span class="${getPhaseBadge(b.phase)}">${b.phase}</span></td>
                <td><span style="font-weight:600;color:#f97316;">₹${b.commission.toLocaleString()}</span></td>
                <td>${b.venues} venues</span></td>
                <td><span class="${b.status === 'Active' ? 'badge-active' : 'badge-inactive'}">${b.status}</span></td>
                <td>
                    <button class="btn-edit" onclick="openEditModal(${b.id})">✏️ Edit</button>
                    <button class="btn-delete" onclick="deleteBDM(${b.id})">🗑️ Delete</button>
                </td>
            </tr>
        `).join('');
        
        document.getElementById('tableBody').innerHTML = html || '<tr><td colspan="8" style="text-align:center; padding:40px;">No BDMs found</td></tr>';
        updateStats();
    }

    function openAddModal() {
        editId = null;
        document.getElementById('modalTitle').innerText = 'Add New BDM';
        document.getElementById('bdmId').value = '';
        document.getElementById('bdmName').value = '';
        document.getElementById('bdmEmail').value = '';
        document.getElementById('bdmPhone').value = '';
        document.getElementById('bdmZone').value = 'Mumbai West';
        document.getElementById('bdmPhase').value = 'Phase 1';
        document.getElementById('bdmStatus').value = 'Active';
        document.getElementById('bdmModal').style.display = 'flex';
    }

    function openEditModal(id) {
        const bdm = bdms.find(b => b.id === id);
        if (bdm) {
            editId = id;
            document.getElementById('modalTitle').innerText = 'Edit BDM';
            document.getElementById('bdmId').value = bdm.id;
            document.getElementById('bdmName').value = bdm.name;
            document.getElementById('bdmEmail').value = bdm.email;
            document.getElementById('bdmPhone').value = bdm.phone || '';
            document.getElementById('bdmZone').value = bdm.zone;
            document.getElementById('bdmPhase').value = bdm.phase;
            document.getElementById('bdmStatus').value = bdm.status;
            document.getElementById('bdmModal').style.display = 'flex';
        }
    }

    function saveBDM() {
        const name = document.getElementById('bdmName').value.trim();
        const email = document.getElementById('bdmEmail').value.trim();
        const phone = document.getElementById('bdmPhone').value;
        const zone = document.getElementById('bdmZone').value;
        const phase = document.getElementById('bdmPhase').value;
        const status = document.getElementById('bdmStatus').value;
        
        if (!name || !email) {
            alert('Please fill Name and Email');
            return;
        }
        
        if (editId) {
            const index = bdms.findIndex(b => b.id === editId);
            if (index !== -1) {
                bdms[index] = { ...bdms[index], name, email, phone, zone, phase, status };
            }
        } else {
            const commission = phase === 'Phase 1' ? 5000 : phase === 'Phase 2' ? 15000 : phase === 'Phase 3' ? 35000 : 70000;
            const venues = phase === 'Phase 1' ? 2 : phase === 'Phase 2' ? 5 : phase === 'Phase 3' ? 10 : 15;
            bdms.push({ id: nextId++, name, email, phone, zone, phase, commission, venues, status });
        }
        
        closeModal();
        renderTable();
    }

    function deleteBDM(id) {
        if (confirm('Delete this BDM permanently?')) {
            bdms = bdms.filter(b => b.id !== id);
            renderTable();
        }
    }

    function closeModal() {
        document.getElementById('bdmModal').style.display = 'none';
    }

    renderTable();
</script>
</body>
</html>
