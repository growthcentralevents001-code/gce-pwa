<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members Management - GCE Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        h1 { font-size: 28px; font-weight: 700; color: #0f172a; }
        .btn-add { background: #f97316; color: white; border: none; padding: 10px 24px; border-radius: 40px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn-add:hover { background: #ea580c; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: 20px; padding: 20px; border: 1px solid #eef2ff; }
        .stat-number { font-size: 32px; font-weight: 800; color: #f97316; }
        .stat-label { color: #64748b; font-size: 14px; margin-top: 4px; }
        .table-card { background: white; border-radius: 20px; padding: 20px; border: 1px solid #eef2ff; overflow-x: auto; }
        .toolbar { display: flex; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .search-input { padding: 10px 20px; border: 1px solid #e2e8f0; border-radius: 40px; width: 280px; font-size: 14px; }
        .filter-select { padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 40px; background: white; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #eef2ff; }
        th { color: #64748b; font-weight: 600; font-size: 13px; }
        .badge-active { background: #dcfce7; color: #166534; padding: 4px 12px; border-radius: 30px; font-size: 12px; display: inline-block; }
        .badge-inactive { background: #fee2e2; color: #dc2626; padding: 4px 12px; border-radius: 30px; font-size: 12px; display: inline-block; }
        .btn-edit { background: #3b82f6; color: white; border: none; padding: 6px 14px; border-radius: 30px; cursor: pointer; font-size: 12px; margin-right: 6px; transition: background 0.2s; }
        .btn-edit:hover { background: #2563eb; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 30px; cursor: pointer; font-size: 12px; transition: background 0.2s; }
        .btn-delete:hover { background: #dc2626; }
        .btn-view { background: #64748b; color: white; border: none; padding: 6px 14px; border-radius: 30px; cursor: pointer; font-size: 12px; margin-right: 6px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 24px; padding: 28px; width: 500px; max-width: 90%; }
        .modal-content h3 { font-size: 22px; margin-bottom: 20px; color: #0f172a; }
        .modal-content input, .modal-content select { width: 100%; padding: 12px 16px; margin-bottom: 16px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; }
        .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
        .btn-save { background: #f97316; color: white; border: none; padding: 10px 24px; border-radius: 40px; cursor: pointer; font-weight: 600; }
        .btn-cancel { background: #e2e8f0; color: #334155; border: none; padding: 10px 24px; border-radius: 40px; cursor: pointer; font-weight: 600; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #f97316; text-decoration: none; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <a href="/admin-panel/" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
        <h1>Members Management</h1>
        <button class="btn-add" onclick="openAddModal()">+ Add New Member</button>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-number" id="totalMembers">0</div>
            <div class="stat-label">Total Members</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="activeMembers">0</div>
            <div class="stat-label">Active Members</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="goldMembers">0</div>
            <div class="stat-label">Gold Members</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="silverMembers">0</div>
            <div class="stat-label">Silver Members</div>
        </div>
    </div>

    <!-- Members Table -->
    <div class="table-card">
        <div class="toolbar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search by name or email..." onkeyup="renderTable()">
            <select id="typeFilter" class="filter-select" onchange="renderTable()">
                <option value="All">All Types</option>
                <option value="Gold">Gold</option>
                <option value="Silver">Silver</option>
                <option value="Bronze">Bronze</option>
                <option value="Free">Free</option>
            </select>
            <select id="statusFilter" class="filter-select" onchange="renderTable()">
                <option value="All">All Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>
        </div>
        <table id="memberTable">
            <thead>
                <tr><th>Name</th><th>Email</th><th>Type</th><th>Status</th><th>Joined Date</th><th>Actions</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<!-- Add/Edit Modal -->
<div id="memberModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Add New Member</h3>
        <input type="hidden" id="memberId">
        <input type="text" id="memberName" placeholder="Full Name *" required>
        <input type="email" id="memberEmail" placeholder="Email Address *" required>
        <select id="memberType">
            <option value="Gold">Gold</option>
            <option value="Silver">Silver</option>
            <option value="Bronze">Bronze</option>
            <option value="Free">Free</option>
        </select>
        <select id="memberStatus">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-save" onclick="saveMember()">Save</button>
        </div>
    </div>
</div>

<script>
    let members = [
        { id: 1, name: "Rohan Mehta", email: "rohan@gmail.com", type: "Gold", status: "Active", date: "23 May 2025" },
        { id: 2, name: "Neha Kapoor", email: "neha@gmail.com", type: "Silver", status: "Active", date: "22 May 2025" },
        { id: 3, name: "Vikram Singh", email: "vikram@gmail.com", type: "Gold", status: "Active", date: "21 May 2025" },
        { id: 4, name: "Anjali Desai", email: "anjali@gmail.com", type: "Silver", status: "Inactive", date: "20 May 2025" },
        { id: 5, name: "Rahul Sharma", email: "rahul@gmail.com", type: "Bronze", status: "Active", date: "19 May 2025" }
    ];
    let nextId = 6;
    let editId = null;

    function updateStats() {
        document.getElementById('totalMembers').innerText = members.length;
        document.getElementById('activeMembers').innerText = members.filter(m => m.status === 'Active').length;
        document.getElementById('goldMembers').innerText = members.filter(m => m.type === 'Gold').length;
        document.getElementById('silverMembers').innerText = members.filter(m => m.type === 'Silver').length;
    }

    function renderTable() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const type = document.getElementById('typeFilter').value;
        const status = document.getElementById('statusFilter').value;
        
        const filtered = members.filter(m => 
            (type === 'All' || m.type === type) &&
            (status === 'All' || m.status === status) &&
            (m.name.toLowerCase().includes(search) || m.email.toLowerCase().includes(search))
        );
        
        const html = filtered.map(m => `
            <tr>
                <td><strong>${m.name}</strong></td>
                <td>${m.email}</td>
                <td><span style="background:#fef3c7; color:#92400e; padding:4px 12px; border-radius:30px; font-size:12px;">${m.type}</span></td>
                <td><span class="${m.status === 'Active' ? 'badge-active' : 'badge-inactive'}">${m.status}</span></td>
                <td>${m.date}</td>
                <td>
                    <button class="btn-edit" onclick="openEditModal(${m.id})">✏️ Edit</button>
                    <button class="btn-delete" onclick="deleteMember(${m.id})">🗑️ Delete</button>
                </td>
            </tr>
        `).join('');
        
        document.getElementById('tableBody').innerHTML = html || '<tr><td colspan="6" style="text-align:center; padding:40px;">No members found</td></tr>';
        updateStats();
    }

    function openAddModal() {
        editId = null;
        document.getElementById('modalTitle').innerText = 'Add New Member';
        document.getElementById('memberId').value = '';
        document.getElementById('memberName').value = '';
        document.getElementById('memberEmail').value = '';
        document.getElementById('memberType').value = 'Gold';
        document.getElementById('memberStatus').value = 'Active';
        document.getElementById('memberModal').style.display = 'flex';
    }

    function openEditModal(id) {
        const member = members.find(m => m.id === id);
        if (member) {
            editId = id;
            document.getElementById('modalTitle').innerText = 'Edit Member';
            document.getElementById('memberId').value = member.id;
            document.getElementById('memberName').value = member.name;
            document.getElementById('memberEmail').value = member.email;
            document.getElementById('memberType').value = member.type;
            document.getElementById('memberStatus').value = member.status;
            document.getElementById('memberModal').style.display = 'flex';
        }
    }

    function saveMember() {
        const name = document.getElementById('memberName').value.trim();
        const email = document.getElementById('memberEmail').value.trim();
        const type = document.getElementById('memberType').value;
        const status = document.getElementById('memberStatus').value;
        
        if (!name || !email) {
            alert('Please fill Name and Email');
            return;
        }
        
        if (editId) {
            const index = members.findIndex(m => m.id === editId);
            if (index !== -1) {
                members[index] = { ...members[index], name, email, type, status };
            }
        } else {
            const date = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            members.push({ id: nextId++, name, email, type, status, date });
        }
        
        closeModal();
        renderTable();
    }

    function deleteMember(id) {
        if (confirm('Delete this member permanently?')) {
            members = members.filter(m => m.id !== id);
            renderTable();
        }
    }

    function closeModal() {
        document.getElementById('memberModal').style.display = 'none';
    }

    // Load data on page load
    renderTable();
</script>
</body>
</html>
