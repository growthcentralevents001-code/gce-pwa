<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partners Management - GCE Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        h1 { font-size: 28px; font-weight: 700; color: #0f172a; }
        .btn-add { background: #f97316; color: white; border: none; padding: 10px 24px; border-radius: 40px; cursor: pointer; font-weight: 600; }
        .btn-add:hover { background: #ea580c; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: 20px; padding: 20px; border: 1px solid #eef2ff; }
        .stat-number { font-size: 32px; font-weight: 800; color: #f97316; }
        .stat-label { color: #64748b; font-size: 14px; margin-top: 4px; }
        .table-card { background: white; border-radius: 20px; padding: 20px; border: 1px solid #eef2ff; overflow-x: auto; }
        .toolbar { display: flex; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .search-input { padding: 10px 20px; border: 1px solid #e2e8f0; border-radius: 40px; width: 280px; font-size: 14px; }
        .filter-select { padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 40px; background: white; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #eef2ff; }
        th { color: #64748b; font-weight: 600; font-size: 13px; }
        .badge-active { background: #dcfce7; color: #166534; padding: 4px 12px; border-radius: 30px; font-size: 12px; display: inline-block; }
        .badge-inactive { background: #fee2e2; color: #dc2626; padding: 4px 12px; border-radius: 30px; font-size: 12px; display: inline-block; }
        .badge-premium { background: #fef3c7; color: #92400e; padding: 4px 12px; border-radius: 30px; font-size: 12px; display: inline-block; }
        .btn-edit { background: #3b82f6; color: white; border: none; padding: 6px 14px; border-radius: 30px; cursor: pointer; font-size: 12px; margin-right: 6px; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 30px; cursor: pointer; font-size: 12px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 24px; padding: 28px; width: 500px; max-width: 90%; }
        .modal-content h3 { font-size: 22px; margin-bottom: 20px; color: #0f172a; }
        .modal-content input, .modal-content select { width: 100%; padding: 12px 16px; margin-bottom: 16px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; }
        .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
        .btn-save { background: #f97316; color: white; border: none; padding: 10px 24px; border-radius: 40px; cursor: pointer; font-weight: 600; }
        .btn-cancel { background: #e2e8f0; color: #334155; border: none; padding: 10px 24px; border-radius: 40px; cursor: pointer; font-weight: 600; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #f97316; text-decoration: none; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <a href="/admin-panel/" class="back-link">← Back to Dashboard</a>
    
    <div class="header">
        <h1>Partners / Venues Management</h1>
        <button class="btn-add" onclick="openAddModal()">+ Add New Partner</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="stat-number" id="totalPartners">0</div><div class="stat-label">Total Partners</div></div>
        <div class="stat-card"><div class="stat-number" id="activePartners">0</div><div class="stat-label">Active Partners</div></div>
        <div class="stat-card"><div class="stat-number" id="premiumPartners">0</div><div class="stat-label">Premium Partners</div></div>
        <div class="stat-card"><div class="stat-number" id="totalEvents">0</div><div class="stat-label">Total Events</div></div>
    </div>

    <div class="table-card">
        <div class="toolbar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search by name, location..." onkeyup="renderTable()">
            <select id="typeFilter" class="filter-select" onchange="renderTable()">
                <option value="All">All Types</option>
                <option value="Premium">Premium</option>
                <option value="Standard">Standard</option>
            </select>
            <select id="statusFilter" class="filter-select" onchange="renderTable()">
                <option value="All">All Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>
        </div>
        <table id="partnerTable">
            <thead><tr><th>Venue Name</th><th>Location</th><th>Type</th><th>Events</th><th>Revenue</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="partnerModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Add New Partner</h3>
        <input type="hidden" id="partnerId">
        <input type="text" id="partnerName" placeholder="Venue Name *" required>
        <input type="text" id="partnerLocation" placeholder="Location *" required>
        <select id="partnerType"><option value="Premium">Premium</option><option value="Standard">Standard</option></select>
        <select id="partnerStatus"><option value="Active">Active</option><option value="Inactive">Inactive</option></select>
        <div class="modal-buttons"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" onclick="savePartner()">Save</button></div>
    </div>
</div>

<script>
    let partners = [
        { id: 1, name: "The Leela", location: "Mumbai", type: "Premium", events: 12, revenue: 45000, status: "Active" },
        { id: 2, name: "JW Marriott", location: "Mumbai", type: "Premium", events: 8, revenue: 32000, status: "Active" },
        { id: 3, name: "Taj Lands End", location: "Mumbai", type: "Premium", events: 15, revenue: 68000, status: "Active" },
        { id: 4, name: "WeWork BKC", location: "Mumbai", type: "Standard", events: 5, revenue: 12000, status: "Active" },
        { id: 5, name: "Radisson Blu", location: "Delhi", type: "Standard", events: 3, revenue: 8000, status: "Inactive" }
    ];
    let nextId = 6;
    let editId = null;

    function updateStats() {
        document.getElementById('totalPartners').innerText = partners.length;
        document.getElementById('activePartners').innerText = partners.filter(p => p.status === 'Active').length;
        document.getElementById('premiumPartners').innerText = partners.filter(p => p.type === 'Premium').length;
        document.getElementById('totalEvents').innerText = partners.reduce((sum, p) => sum + p.events, 0);
    }

    function renderTable() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const type = document.getElementById('typeFilter').value;
        const status = document.getElementById('statusFilter').value;
        const filtered = partners.filter(p => (type === 'All' || p.type === type) && (status === 'All' || p.status === status) && (p.name.toLowerCase().includes(search) || p.location.toLowerCase().includes(search)));
        const html = filtered.map(p => `<tr><td><strong>${p.name}</strong></td><td>${p.location}</td><td><span class="${p.type === 'Premium' ? 'badge-premium' : ''}">${p.type}</span></td><td>${p.events}</td><td>₹${p.revenue.toLocaleString()}</td><td><span class="${p.status === 'Active' ? 'badge-active' : 'badge-inactive'}">${p.status}</span></td><td><button class="btn-edit" onclick="openEditModal(${p.id})">✏️ Edit</button><button class="btn-delete" onclick="deletePartner(${p.id})">🗑️ Delete</button></td></tr>`).join('');
        document.getElementById('tableBody').innerHTML = html || '<tr><td colspan="7" style="text-align:center; padding:40px;">No partners found</td></tr>';
        updateStats();
    }

    function openAddModal() { editId = null; document.getElementById('modalTitle').innerText = 'Add New Partner'; document.getElementById('partnerId').value = ''; document.getElementById('partnerName').value = ''; document.getElementById('partnerLocation').value = ''; document.getElementById('partnerType').value = 'Standard'; document.getElementById('partnerStatus').value = 'Active'; document.getElementById('partnerModal').style.display = 'flex'; }
    function openEditModal(id) { const p = partners.find(p => p.id === id); if(p) { editId = id; document.getElementById('modalTitle').innerText = 'Edit Partner'; document.getElementById('partnerId').value = p.id; document.getElementById('partnerName').value = p.name; document.getElementById('partnerLocation').value = p.location; document.getElementById('partnerType').value = p.type; document.getElementById('partnerStatus').value = p.status; document.getElementById('partnerModal').style.display = 'flex'; } }
    function savePartner() { const name = document.getElementById('partnerName').value.trim(); const location = document.getElementById('partnerLocation').value.trim(); const type = document.getElementById('partnerType').value; const status = document.getElementById('partnerStatus').value; if(!name || !location){ alert('Please fill all fields'); return; } if(editId){ const index = partners.findIndex(p => p.id === editId); if(index !== -1) partners[index] = { ...partners[index], name, location, type, status }; } else { partners.push({ id: nextId++, name, location, type, events: 0, revenue: 0, status }); } closeModal(); renderTable(); }
    function deletePartner(id) { if(confirm('Delete this partner?')) { partners = partners.filter(p => p.id !== id); renderTable(); } }
    function closeModal() { document.getElementById('partnerModal').style.display = 'none'; }
    renderTable();
</script>
</body>
</html>
